AWSTemplateFormatVersion: '2010-09-09'
Description: 'Cattleya E-commerce Backend Stack (Budget-Friendly)'

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of an existing EC2 KeyPair to enable SSH access to the instance
    ConstraintDescription: must be the name of an existing EC2 KeyPair.
  
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
    Description: EC2 instance type for the backend server
  
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - development
      - staging
      - production
    Description: Environment name

Resources:
  # Security Group for Backend
  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Cattleya backend
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH access
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP access
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS access
        - IpProtocol: tcp
          FromPort: 3001
          ToPort: 3001
          CidrIp: 0.0.0.0/0
          Description: Backend API access
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-cattleya-backend-sg'

  # IAM Role for EC2
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${S3Bucket}/*'
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub '${DatabaseSecret}'

  # IAM Instance Profile
  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2Role

  # S3 Bucket for Application Files
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'cattleya-app-${AWS::AccountId}-${Environment}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldLogs
            Status: Enabled
            ExpirationInDays: 30
            Filter:
              Prefix: logs/
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-cattleya-app-bucket'

  # Secrets Manager for Database Credentials
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'cattleya-db-credentials-${Environment}'
      Description: Database credentials for Cattleya application
      SecretString: !Sub |
        {
          "username": "cattleya_admin",
          "password": "{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}",
          "engine": "postgres",
          "host": "{{resolve:secretsmanager:${DatabaseSecret}:SecretString:host}}",
          "port": 5432,
          "dbname": "cattleya"
        }
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-cattleya-db-secret'

  # EC2 Instance
  BackendInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0c02fb55956c7d316  # Amazon Linux 2
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SecurityGroupIds:
        - !Ref BackendSecurityGroup
      IamInstanceProfile: !Ref EC2InstanceProfile
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y docker git nginx

          # Start and enable Docker
          systemctl start docker
          systemctl enable docker

          # Install Docker Compose
          curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          chmod +x /usr/local/bin/docker-compose

          # Install Node.js
          curl -fsSL https://rpm.nodesource.com/setup_18.x | bash -
          yum install -y nodejs

          # Install PM2
          npm install -g pm2

          # Create application directory
          mkdir -p /opt/cattleya
          cd /opt/cattleya

          # Clone repository (update with your repo URL)
          git clone https://github.com/your-username/Cattleya_E.git .

          # Build and start backend
          cd cattleya-backend
          npm install
          npm run build
          
          # Create environment file
          cat > .env << 'ENV_EOF'
          NODE_ENV=production
          PORT=3001
          DATABASE_URL=postgresql://cattleya_admin:${DatabasePassword}@${DatabaseEndpoint}:5432/cattleya
          JWT_SECRET=${JWTSecret}
          S3_BUCKET=${S3Bucket}
          AWS_REGION=${AWS::Region}
          ENV_EOF
          
          pm2 start npm --name "cattleya-backend" -- start:prod

          # Setup Nginx
          cat > /etc/nginx/conf.d/cattleya.conf << 'NGINX_EOF'
          server {
              listen 80;
              server_name _;
              
              location / {
                  proxy_pass http://localhost:3001;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_cache_bypass $http_upgrade;
              }
          }
          NGINX_EOF

          # Start and enable Nginx
          systemctl start nginx
          systemctl enable nginx

          # Setup CloudWatch agent
          yum install -y amazon-cloudwatch-agent
          cat > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json << 'CW_EOF'
          {
            "logs": {
              "logs_collected": {
                "files": {
                  "collect_list": [
                    {
                      "file_path": "/opt/cattleya/cattleya-backend/logs/*.log",
                      "log_group_name": "/aws/ec2/cattleya-backend",
                      "log_stream_name": "{instance_id}",
                      "timezone": "UTC"
                    }
                  ]
                }
              }
            }
          }
          CW_EOF
          
          systemctl start amazon-cloudwatch-agent
          systemctl enable amazon-cloudwatch-agent

          echo "Cattleya backend setup complete!"
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-cattleya-backend'
        - Key: Environment
          Value: !Ref Environment

  # CloudWatch Dashboard
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub 'Cattleya-Budget-Dashboard-${Environment}'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  ["AWS/EC2", "CPUUtilization", "InstanceId", "${BackendInstance}"],
                  [".", "NetworkIn", ".", "."],
                  [".", "NetworkOut", ".", "."]
                ],
                "period": 300,
                "stat": "Average",
                "region": "${AWS::Region}",
                "title": "EC2 Metrics"
              }
            },
            {
              "type": "log",
              "x": 0,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "query": "SOURCE '/aws/ec2/cattleya-backend'\n| fields @timestamp, @message\n| sort @timestamp desc\n| limit 100",
                "region": "${AWS::Region}",
                "title": "Application Logs"
              }
            }
          ]
        }

  # CloudWatch Alarms
  HighCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Environment}-cattleya-high-cpu'
      AlarmDescription: High CPU utilization on Cattleya backend
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      Statistic: Average
      Period: 300
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 2
      Dimensions:
        - Name: InstanceId
          Value: !Ref BackendInstance
      AlarmActions:
        - !Ref SNSTopic

  # SNS Topic for Alerts
  SNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'cattleya-alerts-${Environment}'
      DisplayName: !Sub 'Cattleya Alerts - ${Environment}'

Outputs:
  BackendInstanceId:
    Description: Instance ID of the backend server
    Value: !Ref BackendInstance
    Export:
      Name: !Sub '${AWS::StackName}-BackendInstanceId'

  BackendPublicIP:
    Description: Public IP address of the backend server
    Value: !GetAtt BackendInstance.PublicIp
    Export:
      Name: !Sub '${AWS::StackName}-BackendPublicIP'

  BackendSecurityGroupId:
    Description: Security Group ID of the backend server
    Value: !Ref BackendSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-BackendSecurityGroupId'

  S3BucketName:
    Description: Name of the S3 bucket for application files
    Value: !Ref S3Bucket
    Export:
      Name: !Sub '${AWS::StackName}-S3BucketName'

  DatabaseSecretArn:
    Description: ARN of the database credentials secret
    Value: !Ref DatabaseSecret
    Export:
      Name: !Sub '${AWS::StackName}-DatabaseSecretArn'

  SNSTopicArn:
    Description: ARN of the SNS topic for alerts
    Value: !Ref SNSTopic
    Export:
      Name: !Sub '${AWS::StackName}-SNSTopicArn' 